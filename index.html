<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CASH HUB | Earn, Complete, Promote & Redeem</title>

  <!-- PWA & Mobile Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#121a2d" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --bg-base: #f8fafc;
      --bg-subtle: #f0f9ff;
      --card-white: #ffffff;
      --card-border: #e2e8f0;
      --card-border-cyan: #bae6fd;

      --cyan-primary: #00b4d8;
      --cyan-hover: #0096c7;
      --cyan-dark: #0077b6;
      --cyan-soft: #e0f7fa;
      --cyan-gradient: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%);
      --cyan-glow: rgba(0, 180, 216, 0.25);

      --blue-accent: #2563eb;
      --blue-gradient: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);

      --wallet-card-bg: linear-gradient(145deg, #172036 0%, #0f1523 100%);
      --text-dark: #0f172a;
      --text-dim: #475569;
      --text-muted: #94a3b8;
      --gold: #f59e0b;
      --gold-soft: #fef3c7;
      --danger: #ef4444;
      --success: #10b981;

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --pill: 999px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
      --transition: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg-base);
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: calc(90px + env(safe-area-inset-bottom));
      user-select: none;
    }

    .app-card {
      background: var(--card-white);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s var(--transition), box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .app-card:hover {
      border-color: var(--card-border-cyan);
      box-shadow: var(--shadow-md);
    }

    /* TOP HEADER */
    header.ios-nav {
      position: sticky;
      top: 0;
      z-index: 99;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(0, 180, 216, 0.04);
    }
    .header-balance-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-app-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-logo-img {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 4px 14px var(--cyan-glow);
      border: 1px solid var(--card-border-cyan);
      background: #ffffff;
      display: grid;
      place-items: center;
    }
    .coin-badge-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--cyan-gradient);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 0.95rem;
      box-shadow: 0 4px 14px var(--cyan-glow);
    }
    .header-coin-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.5px;
      line-height: 1.1;
      display: inline-block;
    }
    .header-coin-val.bounce {
      animation: numPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes numPop {
      0% { transform: scale(1); color: var(--cyan-primary); }
      50% { transform: scale(1.2); color: var(--gold); }
      100% { transform: scale(1); color: var(--text-dark); }
    }
    .header-fiat-val {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--cyan-dark);
    }
    .header-right-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-header-payout {
      background: var(--cyan-gradient);
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: var(--pill);
      font-size: 0.82rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--cyan-glow);
      transition: all 0.2s ease;
    }
    .btn-header-payout:active { transform: scale(0.96); }
    .btn-profile-badge {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--cyan-soft);
      border: 1.5px solid var(--card-border-cyan);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: var(--cyan-dark);
      cursor: pointer;
      font-size: 0.95rem;
      overflow: hidden;
    }
    .btn-profile-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    main {
      position: relative;
      z-index: 1;
      padding: 16px 18px 100px 18px;
      max-width: 580px;
      margin: 0 auto;
    }
    .view-panel {
      display: none;
      animation: fadeIn 0.24s var(--transition);
    }
    .view-panel.active-view {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 7-DAY LOGIN STREAK */
    .streak-container {
      padding: 18px 16px;
    }
    .streak-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .streak-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-dark);
    }
    .streak-badge-pill {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--cyan-dark);
      background: var(--cyan-soft);
      padding: 4px 10px;
      border-radius: var(--pill);
      border: 1px solid var(--card-border-cyan);
    }
    .streak-row-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px 14px 2px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--card-border-cyan) transparent;
    }
    .streak-row-scroll::-webkit-scrollbar { height: 5px; }
    .streak-row-scroll::-webkit-scrollbar-thumb {
      background: var(--card-border-cyan);
      border-radius: 10px;
    }
    .streak-day-card {
      flex: 0 0 84px;
      background: var(--bg-subtle);
      border: 1.5px solid var(--card-border-cyan);
      border-radius: var(--radius-md);
      padding: 12px 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .streak-day-card.active-day {
      background: #f0fdf4;
      border-color: var(--success);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.2);
      transform: translateY(-2px);
    }
    .streak-day-card.claimed {
      opacity: 0.5;
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .streak-day-card.day-7-jackpot {
      border-color: var(--gold);
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
    }
    .streak-day-title {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--text-dim);
    }
    .streak-coin-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--gold-soft);
      color: var(--gold);
      font-size: 0.75rem;
      font-weight: 800;
      display: grid;
      place-items: center;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .streak-reward-val {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .btn-cyan {
      width: 100%;
      background: var(--cyan-gradient);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: var(--pill);
      font-size: 0.95rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--cyan-glow);
      transition: all 0.2s ease;
    }
    .btn-cyan:active { transform: scale(0.97); }
    .btn-cyan:disabled {
      background: #cbd5e1;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .hero-earn-duo-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }
    .btn-earn-hero {
      padding: 18px 16px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      border: none;
      color: #ffffff;
      box-shadow: var(--shadow-md);
      transition: all 0.2s var(--transition);
    }
    .btn-earn-hero:active { transform: scale(0.96); }
    .btn-click-earn { background: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%); }
    .btn-follow-earn { background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%); }
    .hero-icon-bubble {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.22);
      display: grid;
      place-items: center;
      font-size: 1.3rem;
      color: #fff;
    }
    .hero-title-text {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .hero-sub-text {
      font-size: 0.72rem;
      opacity: 0.9;
      line-height: 1.2;
    }
    .hero-reward-pill {
      margin-top: 4px;
      background: rgba(0, 0, 0, 0.2);
      padding: 4px 10px;
      border-radius: var(--pill);
      font-size: 0.72rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* GAME GRID WITH TIMERS */
    .game-actions-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .game-action-btn {
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      background: var(--card-white);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .game-action-btn:active { transform: scale(0.96); }
    .game-action-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 1.15rem;
      color: var(--cyan-dark);
      background: var(--cyan-soft);
      position: relative;
    }
    .game-cooldown-badge {
      font-size: 0.62rem;
      font-weight: 800;
      color: var(--danger);
      background: #fee2e2;
      padding: 2px 4px;
      border-radius: var(--pill);
      display: none;
    }
    .game-action-label {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .promocode-card {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff;
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 18px;
    }
    .promocode-input-wrap {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .promocode-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: var(--pill);
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      outline: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-apply-promo {
      background: var(--cyan-primary);
      color: #fff;
      font-weight: 800;
      border: none;
      padding: 12px 20px;
      border-radius: var(--pill);
      cursor: pointer;
      font-size: 0.85rem;
    }

    .task-cat-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .task-cat-tabs::-webkit-scrollbar { display: none; }
    .task-tab-pill {
      flex: 0 0 auto;
      padding: 9px 18px;
      border-radius: var(--pill);
      background: var(--card-white);
      border: 1px solid var(--card-border);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .task-tab-pill.active {
      background: var(--cyan-primary);
      color: #ffffff;
      border-color: var(--cyan-primary);
      box-shadow: 0 4px 12px var(--cyan-glow);
    }

    .task-row {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card-white);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.3s var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .task-row:hover { border-color: var(--card-border-cyan); }
    .task-row.task-completed-anim {
      transform: scale(0.9) translateY(-10px);
      opacity: 0;
      pointer-events: none;
      height: 0;
      padding: 0;
      margin: 0;
      border: none;
      overflow: hidden;
    }
    .task-icon-box {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      flex-shrink: 0;
      background: var(--cyan-soft);
      color: var(--cyan-dark);
      border: 1px solid var(--card-border-cyan);
      overflow: hidden;
    }
    .task-icon-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .task-info {
      flex: 1;
      min-width: 0;
    }
    .task-title {
      font-size: 0.94rem;
      font-weight: 800;
      color: var(--text-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-desc {
      font-size: 0.76rem;
      color: var(--text-dim);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-progress-mini {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--cyan-dark);
      margin-top: 3px;
    }
    .task-reward-box { text-align: right; }
    .task-reward-tag {
      font-weight: 800;
      color: var(--cyan-dark);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 4px;
      justify-content: flex-end;
    }
    .task-btn-action {
      background: var(--cyan-primary);
      color: #ffffff;
      padding: 5px 14px;
      border-radius: var(--pill);
      font-size: 0.72rem;
      font-weight: 800;
      border: none;
    }

    /* REFERRAL HUB */
    .referral-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .referral-header-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-dark);
    }
    .btn-referral-history {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card-white);
      border: 1px solid var(--card-border);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--cyan-primary);
      font-size: 1.1rem;
    }
    .refer-hero-card {
      background: var(--blue-gradient);
      border-radius: 28px;
      padding: 22px;
      color: #ffffff;
      box-shadow: 0 16px 36px rgba(37, 99, 235, 0.25);
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .refer-hero-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .badge-per-friend {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 7px 14px;
      border-radius: var(--pill);
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-hero-info {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      display: grid;
      place-items: center;
      font-size: 0.85rem;
      color: #fff;
      cursor: pointer;
    }
    .refer-code-inner-card {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-dark);
      margin-bottom: 14px;
    }
    .code-inner-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      display: block;
      margin-bottom: 4px;
    }
    .code-inner-val {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--cyan-dark);
    }
    .btn-copy-code {
      background: var(--cyan-soft);
      border: 1px solid var(--card-border-cyan);
      border-radius: var(--pill);
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--cyan-dark);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .refer-actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btn-refer-action {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      padding: 14px;
      font-size: 0.92rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }

    /* OFFICIAL APP SHARE CARD */
    .official-share-card {
      background: var(--card-white);
      border: 1.5px dashed var(--card-border-cyan);
      border-radius: 20px;
      padding: 18px 20px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .official-share-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .official-share-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--cyan-soft);
      color: var(--cyan-dark);
      display: grid;
      place-items: center;
      font-size: 1.25rem;
    }
    .official-share-btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-sub-share {
      padding: 10px;
      border-radius: var(--pill);
      font-size: 0.82rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      border: 1px solid var(--card-border);
      background: var(--bg-subtle);
      color: var(--text-dark);
    }

    .refer-metrics-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }
    .metric-card-box {
      background: var(--card-white);
      border-radius: 20px;
      padding: 18px 16px;
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow-sm);
    }
    .metric-icon-wrap {
      width: 48px;
      height: 48px;
      border-radi
